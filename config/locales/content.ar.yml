    pages_340: "تنبيه مهني وقانوني"
    pages_341: "يحتوي المعرض على مواد سريرية وصور لحالات علاجية خاضعة لبروتوكولات الخصوصية والموافقة الطبية المستنيرة. تُعرض هذه المواد لغرض التقييم السريري والتدريب الطبي فقط — ويُمنع منعًا باتًا تصوير الشاشة أو حفظ الملفات أو إعادة استخدام الصور في أي وسيلة إعلانية أو منصة تواصل."
    pages_342: "أقر بأنني طبيب أو ممارس صحي مرخص، وأوافق على شروط سرية واستخدام المواد السريرية المعروضة."
    pages_343: "الدخول إلى المعرض السريري"
    pages_344: "يُسجَّل إقرار الدخول بتاريخه ووقته، وتُطبَّق العلامة المائية الديناميكية والتتبع الرقمي على كل المواد."
    pages_345: "هيكل المعرض"
    pages_346: "ثلاث فئات — لكل منتج حالاته وبياناته السريرية"
    pages_347: "الحالات تُجمع من العيادات الشريكة بموافقة خطية موثقة، وتُنشر مع بياناتها السريرية الكاملة."
    pages_348: "الخطوط السطحية والهالات"
    pages_349: "لقطات قريبة عالية الدقة لعلاج الهالات (Tear Trough) والخطوط الدقيقة حول الفم والعين — مع الكمية المحقونة، وقياس الإبرة (30G)، وتقنية الحقن، وتوقيت الصورة."
    pages_35: "البنية التشغيلية"
    pages_350: "الشفاه والتجاعيد المتوسطة"
    pages_351: "حالات تحديد وتعبئة الشفاه وعلاج خطوط الابتسامة العميقة — مع الكمية بالملليلتر، ونوع الأداة ومقاسها، وتوقيت الصورة بعد الإجراء."
    pages_352: "النحت والتحديد العميق"
    pages_353: "لقطات كاملة للوجه لنحت خط الفك وإبراز الذقن ورفع الوجنتين — مع توزيع الكمية لكل منطقة، ومستوى الحقن، والأداة المستخدمة."
    pages_354: "الحالات قيد التجميع"
    pages_355: "تُعرض الصور بعلامة مائية ديناميكية (وقت الاطلاع ورقم الجلسة) وبصمة رقمية داخل الملف، مع تعطيل التحميل والنسخ — وفق طبقات الحماية الثلاث المعتمدة."
    pages_356: "طلب عرض سعر"
