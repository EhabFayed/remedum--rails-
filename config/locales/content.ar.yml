    pages_439: "١. هوية جهة التحكم في البيانات"
    pages_44: "الإشراف التشغيلي الشامل، والصلاحيات الاستراتيجية والمالية."
    pages_440_html: "تُصاغ هذه السياسة وتُطبق باسم <b style=\"color:var(--ink)\">شركة جذور الجمال للتجارة</b> (شركة ذات مسؤولية محدودة، مسجلة بالسجل التجاري في الرياض، المملكة العربية السعودية) بصفتها جهة التحكم المسؤولة عن جمع ومعالجة البيانات عبر هذا الموقع."
    pages_441: "٢. بند الأهلية وحصرية التوريد الطبي للمنشآت (إلزامي ونظامي)"
    pages_442: "تُورَّد وتُباع منتجات ReMedium® من مستحضرات التجميل الطبي والأجهزة والمستلزمات الطبية للمنشآت الصحية المرخّصة والمصنّفة المعتمدة لدى شركة جذور الجمال فقط، ولا تُباع للأفراد ولا لأي جهة غير مرخّصة. تُستخدم البيانات التي نجمعها عبر نماذج الموقع للتحقق من استيفاء هذه الأهلية النظامية وإتمام إجراءات التوريد والتعاقد الرسمي، وتحتفظ شركة جذور الجمال بالحق الكامل في رفض أي طلب أو إلغاء أي تعامل لا يستوفي التراخيص والاشتراطات المحددة نظامًا."
    pages_443: "٣. البيانات التي يتم جمعها"
    pages_444: "بيانات التواصل والمنشأة: الاسم الكامل، والبريد الإلكتروني الرسمي، ورقم الجوال/واتساب، واسم المنشأة الصحية ومدينتها، ونوع النشاط عبر نموذج طلب عرض السعر · إقرارات الصفة المهنية: تسجيل إقرار الممارس الصحي الإلكتروني قبل الاطلاع على أقسام المعلومات والنتائج السريرية · ملفات تعريف الارتباط والبيانات الفنية: ملفات التتبع الأساسية والتحليلية لتحسين تجربة التصفح وحماية جلسات الدخول · الخرائط المضمنة: بيانات الموقع القياسية المتولدة عند التفاعل مع خريطة مقر الشركة (Google Maps)."
    pages_445: "٤. الأغراض والأساس النظامي للمعالجة"
    pages_446: "التحقق من صفة المنشأة وإصدار عروض الأسعار الرسمية وجدولة التوريد والتدريب · الالتزام بمتطلبات التوثيق الرقابي واليقظة الصادرة عن الهيئة العامة للغذاء والدواء · حماية أمن الموقع والتحقق من الاستخدام المصرح به للمعلومات الطبية المحمية."
    pages_447: "٥. حفظ البيانات وسريتها"
    pages_448: "تُحفظ البيانات داخل خوادم آمنة ومشفرة، ولا تتم مشاركتها أو بيعها لأي أطراف خارجية، ويقتصر تداولها على الإدارات المختصة لإتمام التعاقد النظامي، ولا يُحتفظ بها إلا للمدد اللازمة نظامًا."
    pages_449: "٦. حقوق أصحاب البيانات"
    pages_45: "الدكتور محمود عادل"
    pages_450_html: "يحق لممثلي المنشآت والمستخدمين وفق نظام حماية البيانات الشخصية طلب مراجعة بياناتهم أو تحديثها أو حذفها عبر التواصل المباشر مع مسؤول الامتثال عبر البريد: <span class=\"lat\" dir=\"ltr\">compliance@beautyroots.sa</span>."
    pages_451: "صيغة أولى بحسب ملف هيكل الموقع — وتُعتمد نهائيًا بعد المراجعة القانونية."
    pages_452: "شروط وأحكام الاستخدام"
    pages_453: "القواعد المنظمة لاستخدام المنصة، وحقوق الملكية الفكرية، وضوابط سرية المحتوى السريري لشركة جذور الجمال."
    pages_454: "١. قبول الشروط والأهلية النظامية"
    pages_455: "يخضع استخدام هذا الموقع للشروط والأحكام الموضحة هنا ولجميع الأنظمة واللوائح المعمول بها في المملكة العربية السعودية، ويُعد تصفحك للموقع إقرارًا بالموافقة التامة عليها. يقتصر طلب التوريد التجاري والمنتجات الطبية على المنشآت الصحية المرخصة والممارسين المعتمدين من الهيئة العامة للغذاء والدواء."
    pages_456: "٢. حقوق الملكية الفكرية والعلامة التجارية"
    pages_457: "جميع المواد المنشورة على هذا الموقع — بما في ذلك العلامات التجارية، والهوية البصرية، والنصوص التعريفية، والملفات العلمية، والتصاميم، والبرمجيات، والبيانات — ملكية حصرية لشركة جذور الجمال للتجارة وتخضع للحماية بموجب نظام حماية حقوق المؤلف ونظام العلامات التجارية في المملكة. يُمنع منعًا باتًا نسخ أو اقتباس أو إعادة استخدام أي جزء منها دون إذن خطي مسبق."
    pages_458: "٣. سرية وحماية صور ونتائج الحالات السريرية"
    pages_459: "تخضع كافة صور الحالات السريرية (قبل وبعد) والبيانات العلاجية المعروضة في قسم المعلومات الطبية لأعلى معايير الحماية والسرية: تُعرض لغرض التقييم المهني والاطلاع العلمي للكوادر الطبية المرخصة فقط · يُحظر تمامًا تصوير الشاشة أو تحميل الملفات أو إعادة نشر الصور في أي وسيلة إعلانية أو حملة تسويقية أو منصة تواصل اجتماعي · تُطبّق الشركة تقنيات العلامة المائية الديناميكية والتتبع الرقمي لرصد أي تسريب واتخاذ كافة الإجراءات اللازمة."
    pages_46: "مدير مبيعات منتجات التجميل الطبي"
    pages_460: "٤. ضوابط استخدام قسم المعلومات الطبية"
    pages_461: "يقتضي الدخول إلى معرض النتائج السريرية وحالات قبل وبعد إقرار المستخدم الصريح بصفته المهنية كطبيب أو ممارس صحي مرخص. يُعد أي تحايل رقمي أو تقديم بيانات غير صحيحة للوصول إلى هذه المواد انتهاكًا مباشرًا لاتفاقية الاستخدام."
    pages_462: "٥. حدود المسؤولية"
    pages_463: "تُقدّم جذور الجمال المواصفات الفنية وبروتوكولات المصنّع لأغراض التوريد والتعريف الطبي. وتقع المسؤولية المهنية الكاملة للتشخيص وتحديد ملاءمة المنتج وإجراءات الحقن على عاتق الطبيب المعالج والمنشأة الصحية المشرفة وفق معايير الممارسة الطبية المعتمدة."
    pages_464: "٦. النظام الحاكم والاختصاص القضائي"
    pages_465: "تخضع هذه الشروط وتُفسر وفقًا للأنظمة واللوائح والتعليمات السارية في المملكة العربية السعودية، وتختص المحاكم واللجان القضائية المختصة في مدينة الرياض حصريًا بالفصل في أي نزاع ينشأ عن استخدام هذا الموقع أو تفسير بنوده."
    pages_466: "إخلاء المسؤولية الطبية والسريرية"
    pages_467: "حدود المحتوى المنشور، ونطاق المعلومات الفنية، وضوابط الاستخدام المهني المخصص للممارسين الصحيين."
    pages_468: "١. طبيعة المعلومات المنشورة على الموقع"
    pages_469: "تُقدَّم كافة البيانات العلمية، ومواصفات المنتجات، وبروتوكولات الحقن، والنتائج السريرية المنشورة على هذا الموقع لأغراض التعريف المهني والتثقيف الفني والتوريد التجاري المعتمد فقط. لا يُعتبر أي جزء من هذا المحتوى استشارة طبية مباشرة، أو تشخيصًا علاجيًا، أو بديلًا عن التقييم السريري المستقل للمرضى."
    pages_47: "الإشراف والتشغيل الشامل لجميع منتجات التجميل الطبي."
    pages_470: "٢. حصرية الاستخدام بواسطة الممارس الصحي المرخص"
    pages_471: "تُصنَّف منتجات ReMedium® من فيلر حمض الهيالورونيك، ومحاليل جراحات العيون، والأجهزة الطبية ذات الصلة كمنتجات ذات استخدام مهني مقيد. يُحظر استخدامها أو حقنها إلا بواسطة أطباء وممارسين صحيين مرخصين ومعتمدين من الهيئة العامة للغذاء والدواء داخل منشآت طبية مرخصة نظامًا."
    pages_472: "٣. انتفاء العلاقة العلاجية مع الأفراد"
    pages_473: "لا يُنشئ التصفح أو الاطلاع على بروتوكولات الحقن أو التواصل عبر نماذج الموقع أي علاقة طبيب ومريض. يجب على الأفراد الباحثين عن العلاجات التجميلية مراجعة العيادات والمراكز الصحية المعتمدة للحصول على الاستشارة المباشرة من الطبيب المختص."
    pages_474: "٤. استقلالية القرار الطبي والمسؤولية السريرية"
    pages_475: "تلتزم جذور الجمال بتوفير بيانات المصنّع والدراسات المخبرية المعتمدة، وتظل المسؤولية الطبية والنظامية الكاملة لتقييم الحالات، وتحديد موانع الاستخدام، واختيار تقنية وعمق الحقن، وإدارة أي تفاعلات سريرية على عاتق الطبيب المعالج والمنشأة الطبية المشرفة."
    pages_476: "شريط التنبيه الطبي المختصر"
    pages_477: "«إخلاء مسؤولية طبية: محتوى هذا القسم موجه حصريًا للممارسين الصحيين المرخصين. منتجات ReMedium® تُستخدم وتُحقن بيد طبيب مرخص فقط.» — يظهر هذا السطر مع رابط الصفحة أسفل كل صفحة تحمل محتوى طبيًا."
