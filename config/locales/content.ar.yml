    pages_400: "خلف الكواليس: كل الطلبات في جدول واحد قابل للتصدير بحالة لكل طلب (جديد · تم التواصل · مغلق)، ويُسجَّل مصدر الزيارة مع كل طلب لنعرف أي صفحة تجلب الطلبات فعلًا — مع حماية من الإرسال الآلي دون كابتشا مزعجة."
    pages_401: "مركز المعرفة والآراء"
    pages_402: "مقالات بمراجعة طبية تجيب عن أسئلة المستخدمة الحقيقية، وثلاثة مسارات للآراء مرتبة حسب قوة المصداقية."
