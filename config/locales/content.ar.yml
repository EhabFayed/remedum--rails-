    pages_387: "قواعد ثابتة على كل محتوى في الموقع"
    pages_388: "لا وعد بنتيجة، ولا ضمان، ولا صيغة تفضيل مطلق · لا صور قبل وبعد على أي صفحة عامة — داخل المعلومات الطبية فقط، خلف الإقرار وبطبقة الحماية · لا مقارنة بمنتج منافس بالاسم، ولا ذكر أسعار · المنتج يُصرف ويُحقن عن طريق الطبيب فقط، ولا يُباع للأفراد · كل رقم يُنشر له مصدر في الملف التقني، ولا تُستخدم أي مادة تعريفية قبل مراجعتها."
