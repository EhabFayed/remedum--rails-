    legal_terms_title: "شروط وأحكام الاستخدام"
    medical_evidence_description: "بيانات انسيابية وفيزيائية موثقة، دراسات مقارنة منشورة، وتوجيهات الحقن المعتمدة من المصنع للكوادر الطبية."
    medical_evidence_title: "الأدلة المخبرية وبروتوكولات الحقن"
    medical_quote_description: "نموذج واحد يجمع الأساسي — وفريق المبيعات يتواصل ويكمل التفاصيل ويصدر عرضًا رسميًا."
    medical_quote_title: "طلب عرض سعر"
