    pages_421: "مراجعة طبية"
    pages_422: "تصنيفات ثابتة: أساسيات · مناطق · أمان · للأطباء — ومقال مخصّص لكل منطقة علاج يربط بمنتجها وبسيكشن المنطقة ذي الصلة. كل مقال يمر على مراجعة طبية قبل النشر."
    pages_423: "قواعد ثابتة على كل محتوى في الموقع"
    pages_424: "لا وعد بنتيجة، ولا ضمان، ولا صيغة تفضيل مطلق · لا صور قبل وبعد على أي صفحة عامة — داخل المعلومات الطبية فقط، خلف الإقرار وبطبقة الحماية · لا مقارنة بمنتج منافس بالاسم، ولا ذكر أسعار · المنتج يُصرف ويُحقن عن طريق الطبيب فقط، ولا يُباع للأفراد · كل رقم يُنشر له مصدر في الملف التقني، ولا تُستخدم أي مادة تعريفية قبل مراجعتها."
