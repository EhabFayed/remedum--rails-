    medical_service_model_description: "ست خطوات من التواصل إلى المتابعة، والشروط التجارية وسياسة الصلاحية، والتدريب والدعم الفني."
    medical_service_model_title: "نموذج الخدمة والشروط التجارية"
    pages_1: "عن جذور الجمال"
    pages_10: "«جذور الجمال» شركة سعودية تعمل في المجال الطبي، وتتعاون مع المستشفيات والعيادات والمراكز الطبية في مختلف مناطق المملكة. ومن خلال محفظة مختارة من المنتجات والعلامات المتخصصة، تجمع الشركة بين اختيار المنتجات والمصانع المؤهلة وإدارة الاستيراد والتخزين والتوزيع، إلى جانب الدعم الفني والمتابعة التي تستمر مع المنشآت الطبية بعد وصول المنتج."
    pages_100: "ar"
    pages_101: "موقعنا على الخريطة"
    pages_102: "للمنشآت: نموذج طلب عرض السعر هو أسرع طريق لعرض رسمي وموثّق. للجمهور: اسألي طبيبك — المنتج يصل عبر المنشآت الصحية المرخّصة فقط."
    pages_103: "واتساب مباشر"
    pages_104: "حسابات التواصل الاجتماعي المعتمدة تُدرج هنا فور اعتمادها — ولا يُنشر أي حساب قبل تأكيده. البيانات التي تُجمع عبر النماذج تُعالج وفق سياسة الخصوصية ونظام حماية البيانات الشخصية السعودي."
    pages_105: "الجودة والالتزام"
    pages_106: "نعمل وفق متطلبات الهيئة العامة للغذاء والدواء (SFDA)، ضمن منظومة واضحة تشمل تسجيل المنتجات واستيرادها وتخزينها وتوزيعها."
    pages_107: "نعمل وفق متطلبات الهيئة العامة للغذاء والدواء (SFDA)، ضمن منظومة واضحة تشمل تسجيل المنتجات واستيرادها وتخزينها وتوزيعها، مع الحفاظ على التتبع في مختلف مراحل تداول المنتج."
