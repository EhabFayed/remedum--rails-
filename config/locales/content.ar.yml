  content:
    brands_1: "للخطوط الدقيقة والسطحية"
    brands_10: "إبرة 30G فائقة الدقة"
    brands_100: "العناية المخصصة بالبشرة"
    brands_101: "مستحضرات العناية الكورية المتقدمة"
    brands_102: "توفر «جذور الجمال» تشكيلات مختارة من أبرز علامات العناية الكورية المعروفة بنقاء مكوناتها وفاعليتها في تهدئة البشرة وترميمها. نستورد هذه المنتجات مباشرة من المعامل الكورية المعتمدة لتكون مكملًا مثاليًا بعد الإجراءات الطبية ولروتين العناية اليومي."
    brands_103: "تشكيلة عناية بالبشرة"
    brands_104: "تركيبات السنتيلا الآسيوية (Centella Asiatica) لتهدئة البشرة الحساسة وترميم الحاجز الجلدي."
    brands_105: "حلول عناية آمنة بمكونات نقية وواضحة تركز على صحة وتوازن طبقات الجلد."
    brands_106: "مستخلصات نباتية فعالة لترطيب عميق، وتعزيز النضارة، وحيوية البشرة اليومية."
    brands_107: "توليفات عشبية طبيعية تمنح البشرة تغذية لطيفة وتوازنًا مستدامًا."
    brands_108: "مسجّلة لدى الهيئة"
    brands_109: "تصفح التشكيلة الكاملة"
    brands_11: "الخطوط الدقيقة حول العين (Crow’s Feet) · التجاعيد التعبيرية الخفيفة حول الفم · خطوط الجبهة السطحية · تحسين نضارة الرقبة"
    brands_110: "للاطلاع على كافة المنتجات والتشكيلات المتوفرة من علامات العناية المعتمدة — الرابط يفتح في تبويب جديد."
    brands_111: "إشعار ضمان الجودة"
    brands_112: "كافة العلامات المندرجة في محفظتنا مسجّلة نظاميًا لدى الهيئة العامة للغذاء والدواء (SFDA) وتُدار عبر سلسلة إمداد وتخزين مبرّدة ومراقبة بدقة."
    brands_113: "فيلر ReMedium® للهيالورونيك أسيد"
    brands_114: "الجيل المتقدم من الفيلر الكوري المصنّع بتقنية MDM الحاصلة على براءة اختراع — جذور الجمال الوكيل الحصري والموزّع المعتمد في المملكة."
