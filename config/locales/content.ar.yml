    pages_152: "تعاقد وتوريد مباشر: استيراد حصري من المصانع العالمية الأم دون وسطاء أو أسواق ثانوية — والسلسلة مسار واحد متصل، كل مرحلة فيه موثّقة وقابلة للتتبع."
