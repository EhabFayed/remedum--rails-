    brands_177: "الصياغة التقنية النهائية تُعتمد بما يطابق الملف التقني المسجَّل (IFU) لدى الهيئة العامة للغذاء والدواء."
    brands_178: "للممارسين المرخّصين"
    brands_179: "الملف التقني الكامل وبروتوكولات الاستخدام والمواد السريرية — خلف بوابة الإقرار في قسم المعلومات الطبية."
