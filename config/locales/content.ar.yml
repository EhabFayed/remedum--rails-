    brands_20: "خطوط الجبهة"
    brands_200: "مدة ثبات النتيجة تقريبية وتتفاوت بحسب طبيعة المنطقة المحقونة، والكمية المستخدمة، وطبيعة استجابة الجسم من شخص لآخر. اختيار نوع المنتج وعمق الحقن يخضع لقرار الطبيب المعالج حصرًا — والمنتج يُصرف ويُحقن عن طريق الطبيب فقط، ولا يُباع للأفراد."
