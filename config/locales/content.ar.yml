    pages_157: "التسجيل والاستيراد"
    pages_158: "استكمال متطلبات التسجيل والاستيراد لدى الجهات المختصة، وشحن مضبوط الظروف، وتخليص جمركي بمستندات مكتملة."
    pages_159: "الاستلام والفحص"
    pages_16: "أن نكون المرجع الأكثر ثقة للمنشآت الصحية في المملكة بمعايير أمان وانضباط لا تقبل المساومة."
    pages_160: "فحص المطابقة وسلامة العبوات وتواريخ الصلاحية وأرقام التشغيلات، وتسجيلها في نظام المخزون قبل الإدخال."
    pages_161: "التخزين والتسليم"
    pages_162: "حفظ وفق ظروف المصنّع في مستودعنا المرخّص، ثم صرف بنظام الأقدم صلاحيةً أولًا، وتسليم موثّق مع بيان الدفعة."
    pages_163: "التتبّع والمستندات المرافقة"
    pages_164: "تسجيل مزدوج للشحنات: يُوثَّق رقم التشغيلة وتاريخ الصلاحية آليًا عند الإدخال للمستودع وعند الصرف للعميل، بما يتيح تتبع أي عبوة وصولًا إلى دفعة الإنتاج ومصنعها في أي وقت. وتصدر كل شحنة بفاتورة ضريبية رسمية، وبيان تسليم معتمد، وتعليمات الحفظ الخاصة بالمصنّع."
