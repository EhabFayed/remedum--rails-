    brands_182_html: "أين يعمل <span class=\"lat\" dir=\"ltr\">Fine</span>؟ — كما ورد في ملف الشركة"
    brands_183: "سيكشن مستقل خارج التبويبين، مرئي للجمهورين. كل منطقة يصل إليها رابط ثابت من خريطة الوجه في الرئيسية ومن المقالات."
    brands_184: "خريطة الوجه"
