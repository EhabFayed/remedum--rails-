    brands_288: "مستحضرات لزجة مخصصة للاستخدام أثناء العمليات الجراحية داخل العين، تساعد في الحفاظ على مساحة وعمق الحجرة الأمامية ودعم حماية الأنسجة الحساسة، بما يهيئ بيئة مناسبة لإجراء المناورات الجراحية داخل العين."
