    pages_403: "1. Data controller identification"
    pages_404_html: "This Privacy Policy governs the processing of personal and corporate data collected by <b style=\"color:var(--ink)\">Beauty Roots Trading Company, LLC</b> (Commercial Registration: Riyadh, Saudi Arabia), operating as the designated Data Controller."
    pages_405: "2. B2B commercial & professional eligibility clause (mandatory)"
    pages_406: "ReMedium® medical aesthetic products and regulated medical devices are exclusively supplied and sold to authorized, SFDA-licensed healthcare facilities verified by Beauty Roots Trading Company. These products are not sold to individual consumers or unlicensed entities. Data collected via website quotation forms, inquiries, and professional verification gates is processed strictly to verify institutional eligibility, validate professional status, and fulfill commercial supply agreements. Beauty Roots reserves the absolute right to reject any inquiry, quotation, or procurement request that fails to fulfill regulatory and licensing prerequisites."
    pages_407: "3. Categories of data collected"
    pages_408: "Institutional & contact data: representative full name, official corporate email, phone/WhatsApp number, healthcare facility name, licence category and city submitted via quote requests · Professional self-attestation: digital confirmation logs certifying healthcare-practitioner status prior to accessing gated clinical sections · Technical & analytics data: IP address, browser type, interaction telemetry, and standard essential/analytical cookies · Embedded map services: location interactions via embedded Google Maps for corporate address verification."
    pages_409: "4. Legal basis & purpose of processing"
    pages_41: "Specialized expertise and trusted support, empowering your healthcare practice."
    pages_410: "To process B2B supply requests, price quotations, and contract negotiations · to authenticate commercial licences and SFDA compliance requirements · to optimize technical performance, secure digital assets, and protect confidential clinical media."
    pages_411: "5. Data storage, security & retention"
    pages_412: "All collected records are stored on secured servers adhering to strict encryption protocols, never shared or sold to external parties, and retained only for the periods necessary to fulfill contractual obligations or statutory regulatory mandates within Saudi Arabia."
    pages_413: "6. Data subject rights & inquiries"
