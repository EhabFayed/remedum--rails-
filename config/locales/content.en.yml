    pages_472: "3. No patient–doctor relationship"
    pages_473: "Interacting with this website, reviewing clinical protocols, or submitting an inquiry does not create a physician–patient relationship. Individual patients seeking aesthetic or dermatological treatments must consult a licensed medical specialist at an authorized clinic."
