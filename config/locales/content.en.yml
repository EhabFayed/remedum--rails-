    pages_420: "2. Intellectual property rights"
    pages_421: "All content published on this platform — including brand trademarks, corporate identity assets, product descriptions, scientific documentation, graphics, interface designs, and code — is the exclusive proprietary property of Beauty Roots Trading Company. Unauthorized reproduction, modification, distribution, or commercial exploitation without prior written consent is strictly prohibited."
    pages_422: "3. Protection & confidentiality of clinical imagery"
    pages_423: "All clinical before-and-after photographs, case studies, and treatment records hosted within the Medical Information section are confidential and protected by law: clinical assets are made available exclusively for verified professional evaluation and educational purposes · capturing, downloading, screenshotting, scraping, or republishing any clinical imagery on external social media, advertising channels, or third-party websites is strictly forbidden · Beauty Roots utilizes dynamic tracking, forensic watermarking, and active scanning protocols to trace and legally pursue unauthorized distribution."
    pages_424: "4. Terms of access for the medical information hub"
    pages_425: "Accessing the clinical before-and-after showcase strictly requires self-attestation of licensed healthcare-practitioner status. Providing false credentials or circumventing digital access controls constitutes a direct breach of these Terms of Use."
    pages_426: "5. Limitation of liability"
    pages_427: "Beauty Roots provides technical specifications, manufacturer protocols, and product details for informational and procurement purposes. The company accepts no liability for clinical decisions, off-label applications, or treatment outcomes executed by treating practitioners, who retain full professional and statutory responsibility for patient care."
    pages_428: "6. Governing law & jurisdiction"
    pages_429: "These Terms shall be governed by and construed in accordance with the laws and regulations of the Kingdom of Saudi Arabia. Any dispute arising out of or related to the use of this website falls under the exclusive jurisdiction of the competent courts in Riyadh, Saudi Arabia."
