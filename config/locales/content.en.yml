    pages_454: "1. Acceptance of terms & eligibility"
    pages_455: "By accessing this website, you agree to comply with and be bound by these Terms of Use and all applicable laws and regulations in the Kingdom of Saudi Arabia. Wholesale procurement and medical supply requests are strictly restricted to verified, SFDA-licensed healthcare institutions and medical professionals."
    pages_456: "2. Intellectual property rights"
    pages_457: "All content published on this platform — including brand trademarks, corporate identity assets, product descriptions, scientific documentation, graphics, interface designs, and code — is the exclusive proprietary property of Beauty Roots Trading Company. Unauthorized reproduction, modification, distribution, or commercial exploitation without prior written consent is strictly prohibited."
    pages_458: "3. Protection & confidentiality of clinical imagery"
    pages_459: "All clinical before-and-after photographs, case studies, and treatment records hosted within the Medical Information section are confidential and protected by law: clinical assets are made available exclusively for verified professional evaluation and educational purposes · capturing, downloading, screenshotting, scraping, or republishing any clinical imagery on external social media, advertising channels, or third-party websites is strictly forbidden · Beauty Roots utilizes dynamic tracking, forensic watermarking, and active scanning protocols to trace and legally pursue unauthorized distribution."
    pages_46: "Sales Manager — Medical Aesthetics"
    pages_460: "4. Terms of access for the medical information hub"
    pages_461: "Accessing the clinical before-and-after showcase strictly requires self-attestation of licensed healthcare-practitioner status. Providing false credentials or circumventing digital access controls constitutes a direct breach of these Terms of Use."
    pages_462: "5. Limitation of liability"
    pages_463: "Beauty Roots provides technical specifications, manufacturer protocols, and product details for informational and procurement purposes. The company accepts no liability for clinical decisions, off-label applications, or treatment outcomes executed by treating practitioners, who retain full professional and statutory responsibility for patient care."
    pages_464: "6. Governing law & jurisdiction"
    pages_465: "These Terms shall be governed by and construed in accordance with the laws and regulations of the Kingdom of Saudi Arabia. Any dispute arising out of or related to the use of this website falls under the exclusive jurisdiction of the competent courts in Riyadh, Saudi Arabia."
